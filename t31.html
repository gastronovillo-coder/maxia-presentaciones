<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one full-width "stage" per scene, cinematic dark (deliberate single theme), progress rail with acts on top. */
:root{
  --night:#17111C; --plum:#2E2236; --plum-2:#3A2C45; --coral:#E8613C; --violet:#8E6BB0; --lilac:#F4F1F6;
  --ink:#F4F1F6; --muted:#B9ADC4; --line:#4A3B57; --ok:#7BD3A6; --warn:#F2B661; --bad:#F28B8B;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,sans-serif; --f-data:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font:400 18px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(23,17,28,.92);backdrop-filter:blur(8px);padding:10px 16px;border-bottom:1px solid var(--line)}
.rail .in{max-width:880px;margin:0 auto;display:grid;gap:8px}
.rail .top{display:flex;justify-content:space-between;gap:4px 12px;align-items:center;flex-wrap:wrap}
.brand{font:700 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--coral)}
.where{font:500 12px/1.3 var(--f-data);color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--coral)} .dots i.done{background:var(--violet)} .dots i.gap{flex:0 0 6px;background:transparent}
main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
.scene{display:grid;gap:22px;animation:in .45s ease-out}
@keyframes in{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font:600 12px/1.3 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}
h1{font:800 clamp(34px,7vw,64px)/1.02 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font:700 clamp(23px,4.2vw,34px)/1.14 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:700 18px/1.3 var(--f-display);margin:0}
p{margin:0;max-width:64ch}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 22px;border-radius:14px;border:0;background:var(--coral);color:#fff;font:700 17px/1 var(--f-display);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.clip{position:relative;aspect-ratio:16/9;max-width:100%;width:100%;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 70% 20%,#4b2f5e 0%,#24182d 55%,#140e19 100%);border:1px solid var(--line)}
.clip iframe,.clip video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.clip .ph{position:absolute;inset:0;display:grid;place-items:center}
.clip .play{width:72px;height:72px;border-radius:50%;background:var(--coral);display:grid;place-items:center;box-shadow:0 10px 40px rgba(232,97,60,.35)}
.clip .play:before{content:"";border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
.clip .tag{position:absolute;left:12px;top:12px;font:600 11px/1 var(--f-data);letter-spacing:.06em;background:rgba(0,0,0,.5);padding:7px 9px;border-radius:7px;color:var(--lilac)}
.clip .script{position:absolute;left:12px;right:12px;bottom:12px;font-size:14px;line-height:1.4;background:rgba(0,0,0,.6);padding:10px 12px;border-radius:10px;color:var(--lilac);max-height:62%;overflow:auto}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:15px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--plum);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--violet)}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--f-display);background:var(--plum-2);color:var(--lilac)}
.opt.picked{border-color:var(--coral);background:var(--plum-2)} .opt.picked .k{background:var(--coral);color:#fff}
.opt.right{border-color:var(--ok)} .opt.right .k{background:var(--ok);color:#10261b}
.opt:disabled{cursor:default}
.panel{background:var(--plum);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
.theory{background:linear-gradient(135deg,#2a1f33,#231a2b);border:1px solid #5b4670;border-radius:18px;padding:20px;display:grid;gap:10px}
.theory .eyebrow{color:var(--violet)}
.verdict{font:700 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;border-radius:999px;justify-self:start}
.v-ok{background:#183327;color:var(--ok)} .v-warn{background:#352612;color:var(--warn)} .v-bad{background:#3A1C1C;color:var(--bad)}
.cite{font-size:13px;color:var(--muted)}
.big{font:800 clamp(64px,15vw,120px)/.9 var(--f-display);letter-spacing:-.04em;color:var(--coral)}
.gtrack{position:relative;height:64px;border-radius:14px;background:var(--plum);border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:ew-resize}
.gfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--violet),#a785c8);width:50%}
.gtruth{position:absolute;top:0;bottom:0;width:4px;background:var(--coral);opacity:0;transition:opacity .4s}
.gtruth.on{opacity:1}
.gtruth span{position:absolute;top:6px;left:8px;font:700 13px/1 var(--f-data);color:var(--coral);white-space:nowrap}
.glabel{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:800 28px/1 var(--f-display)}
input[type=range]{width:100%;accent-color:var(--coral)}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--plum);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input[type=text]:focus,textarea:focus{outline:3px solid rgba(232,97,60,.4);border-color:var(--coral)}
label{font-weight:600;display:grid;gap:6px}
.tl{position:relative;height:96px;border-radius:14px;background:var(--plum);border:1px solid var(--line);cursor:crosshair}
.tl .axis{position:absolute;left:16px;right:16px;top:58px;height:2px;background:var(--line)}
.tl .tick{position:absolute;top:66px;font:500 11px/1 var(--f-data);color:var(--muted);transform:translateX(-50%)}
.tl .mk{position:absolute;top:22px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font:700 12px/1 var(--f-display);color:#fff}
.tl .gap{position:absolute;top:52px;height:14px;border-radius:7px;background:rgba(242,139,139,.35)}
.chart{width:100%;height:auto;max-width:100%}
.chart text{fill:var(--muted);font:500 12px var(--f-data)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv div{background:var(--plum);border:1px solid var(--line);border-radius:14px;padding:14px}
.kv b{display:block;font:800 30px/1 var(--f-display);color:var(--coral);font-variant-numeric:tabular-nums}
.kv span{font-size:14px;color:var(--muted)}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
.bar .track{grid-column:1/-1;height:14px;border-radius:7px;background:var(--plum-2);overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--violet);width:0;transition:width .9s ease-out}
.bar .n{font:700 15px/1.4 var(--f-data);color:var(--lilac)}
.chips{display:grid;gap:10px}
.chip{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--plum);color:var(--ink);font:inherit;cursor:pointer}
.chip em{font:600 12px/1 var(--f-data);font-style:normal;padding:6px 9px;border-radius:999px;background:var(--plum-2);color:var(--muted);white-space:nowrap}
.chip.ok{border-color:var(--ok)} .chip.no{border-color:var(--bad)}
.card{background:var(--plum);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;min-height:170px}
.card .q{font:700 22px/1.25 var(--f-display)}
.path{display:grid;gap:10px}
.path div{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.path b{font:700 12px/1.3 var(--f-data);color:var(--coral);min-width:92px}
pre{white-space:pre-wrap;background:#0f0b13;border:1px solid var(--line);border-radius:14px;padding:16px;font:500 14px/1.5 var(--f-data);color:var(--lilac);margin:0}
.note{font:500 12px/1.4 var(--f-data);color:var(--muted);border:1px dashed var(--line);padding:8px 10px;border-radius:8px}
.steps{display:grid;gap:10px;counter-reset:s}
.steps .chip{justify-content:flex-start}
.steps .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--plum-2);font:700 13px/1 var(--f-display);color:var(--lilac)}
.steps .chip.set .num{background:var(--coral);color:#fff}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--plum)}
summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="application/json" id="clips">{"E01": {"titulo": "Bienvenida", "escena": 1, "dur": "1:00", "plano": "Vos en la esquina de la pantalla compartida, con la página abierta en la escena 1.", "guion": "Hola a todos, ¿cómo andan? Bienvenidos a la última clase del módulo de presentaciones médicas, que corresponde a la clase 31 de la Diplomatura MAXIA. Nos acercamos al final y solo tengo palabras de agradecimiento por el aguante y el acompañamiento de todos ustedes a lo largo de la Diplomatura. Hoy vamos a ver cómo lograr que una charla médica no se escuche: que se viva. Y para eso, vamos a empezar metiéndole un poco de innovación y cosas nuevas. A ver cómo sale.", "yt": "", "mp4": "", "start": null, "end": null}, "E01B": {"titulo": "Lo que dice tu voto", "escena": 1, "dur": "0:40", "plano": "Vos, con la escena 1 ya respondida en pantalla.", "guion": "Si votaste «en ninguna» o «en una o dos», estás en la mayoría, y no es culpa tuya: nadie nos enseñó a dar charlas donde el público haga algo. Hoy lo vamos a cambiar. Y fijate que acabás de hacer lo primero que te voy a enseñar: no te conté nada, te pregunté.", "yt": "", "mp4": "", "start": null, "end": null}, "C03": {"titulo": "El contrato de la clase", "escena": 2, "dur": "1:00", "plano": "Vos, en cámara.", "guion": "Esta clase es distinta a las dos anteriores. No la vas a mirar: la vas a jugar. Son cuarenta y cinco minutos, en cuatro actos. Primero, por qué la interacción enseña, con evidencia. Segundo, cómo se diseña una charla viva. Tercero, video y avatar, con sus reglas. Y cuarto, cómo armamos esta misma clase y cómo vos armás la tuya. En cada escena vas a hacer algo. Al final te muestro todo tu recorrido. Antes de arrancar, elegí qué querés llevarte.", "yt": "", "mp4": "", "start": null, "end": null}, "C04": {"titulo": "Por qué preguntar antes de mostrar", "escena": 3, "dur": "1:00", "plano": "Vos, en cámara.", "guion": "Lo que acabás de hacer tiene nombre: es una pregunta de predicción. Te pedí que apostaras antes de mostrarte el dato. ¿Por qué funciona? Porque al apostar generás una expectativa, y cuando el dato la confirma o la contradice, el cerebro lo marca como importante. El que apostó cincuenta y vio veintiséis, no se olvida más ese número. Es la herramienta más barata que existe: una pregunta, cuatro opciones y diez segundos. La vamos a usar varias veces en esta clase.", "yt": "", "mp4": "", "start": null, "end": null}, "C05": {"titulo": "La clase magistral como placebo", "escena": 4, "dur": "1:10", "plano": "Vos, en cámara.", "guion": "En investigación educativa pasó algo curioso: la clase magistral terminó siendo el grupo control. El placebo contra el que se compara todo lo demás. El metaanálisis más grande que tenemos reunió doscientos veinticinco estudios en carreras de ciencias. Con aprendizaje activo, los alumnos rindieron casi medio desvío estándar más en los exámenes, y con clase magistral la probabilidad de reprobar fue una vez y media mayor. Los autores llegaron a preguntarse si es ético seguir usando la clase magistral como control. No es educación médica pura, pero el efecto se repite en todas las disciplinas.", "yt": "", "mp4": "", "start": null, "end": null}, "C06": {"titulo": "Lo que enseña es la pregunta", "escena": 5, "dur": "1:00", "plano": "Vos, en cámara. Esta es la idea central de la clase: decila lento.", "guion": "Esta es la escena que me gustaría que te lleves. En educación médica continua, votar con un sistema de respuesta mejoró el aprendizaje frente a la clase didáctica. Pero frente a una clase que integra preguntas, sin aparato, no hubo diferencia. O sea: el aparato no cura. Cura el principio activo, y el principio activo es obligar al cerebro a responder. La inteligencia artificial no cambia eso. Lo que cambia es que armar buenas preguntas, casos y simuladores ahora te lleva minutos.", "yt": "", "mp4": "", "start": null, "end": null}, "C07": {"titulo": "Acabás de hacer práctica de recuperación", "escena": 6, "dur": "1:10", "plano": "Vos, en cámara.", "guion": "Te hice trampa. Esa pregunta sobre la escena tres no era para evaluarte: era para que recuperaras algo de la memoria. Se llama práctica de recuperación. En estudiantes de medicina aleatorizados, los que estudiaron respondiendo preguntas retuvieron a los seis meses el doble que los que solo releyeron el tema: cuarenta contra veinte por ciento. Cada vez que tu público tiene que traer algo de la memoria, ese algo queda más fijo. Una charla interactiva es, en el fondo, una charla con pequeños exámenes disfrazados.", "yt": "", "mp4": "", "start": null, "end": null}, "C08": {"titulo": "El ritmo: cada diez minutos", "escena": 7, "dur": "0:50", "plano": "Vos, en cámara.", "guion": "De todo esto sale una regla práctica de diseño. No es un dato de un estudio: es un criterio que usamos en la Clase 29. Cada ocho a diez minutos, el público tiene que hacer algo. Votar, decidir, calcular, adivinar antes de ver el resultado. Lo que sea, pero algo. Si en diez minutos tu público no hizo nada, se fue al celular, y no a votar.", "yt": "", "mp4": "", "start": null, "end": null}, "C09": {"titulo": "Dos mundos de interacción", "escena": 8, "dur": "0:50", "plano": "Vos, en cámara.", "guion": "Hay dos mundos. En vivo, en un congreso o un ateneo, trescientas personas votan al mismo tiempo y el resultado aparece en la pantalla. En asincrónico, como esta clase, cada uno juega cuando la abre, y la clase se adapta a lo que elige. Son dos mundos distintos y los dos te van a tocar. Lo que los une es que la interacción tiene que ser parte del contenido, no un adorno pegado al final.", "yt": "", "mp4": "", "start": null, "end": null}, "C10": {"titulo": "La pregunta en la que te podés equivocar", "escena": 9, "dur": "0:50", "plano": "Vos, en cámara.", "guion": "La mejor pregunta de encuesta es aquella en la que el público se puede equivocar. «¿Les gustó la charla?» no enseña nada. «¿Qué porcentaje de las referencias que da la IA no existen?», antes de mostrar el dato, enseña. Y un truco: el distractor tiene que ser el error más común de tus colegas, porque ahí está la enseñanza. Las preguntas no las tenés que inventar solo: tu guion maestro ya las tiene adentro, y la IA las saca en un minuto.", "yt": "", "mp4": "", "start": null, "end": null}, "C11": {"titulo": "Debrief del caso", "escena": 10, "dur": "1:20", "plano": "Vos, en cámara. Si querés, un clip por cada opción de la decisión 2.", "guion": "Hablemos del paciente. En la primera decisión, la trampa es el alta: con un Glasgow-Blatchford de trece no se va a ninguna casa. En la segunda, la intuición más común es «cuanto antes, mejor». Pero en un ensayo con quinientos dieciséis pacientes de alto riesgo, la endoscopía en menos de seis horas no redujo la mortalidad frente a la hecha entre seis y veinticuatro. Las guías piden dentro de las veinticuatro horas, ya estabilizado. Y fijate en el formato: un caso que decidís vos enseña razonamiento clínico, sobre todo cuando cada decisión tiene su feedback.", "yt": "", "mp4": "", "start": null, "end": null}, "C12": {"titulo": "El gráfico que se usa", "escena": 11, "dur": "0:50", "plano": "Vos, en cámara, o grabación de pantalla moviendo el control.", "guion": "Esto que en una clase clásica son tres diapositivas y una fórmula que nadie mira, acá es un control que movés. Mismo tratamiento, misma reducción relativa: con riesgo basal bajo necesitás tratar a cien para evitar un evento; con riesgo alto, a diez. Cuando el público lo mueve, lo entiende. Esto se arma con un prompt, sin programar, y se proyecta o se abre desde el celular.", "yt": "", "mp4": "", "start": null, "end": null}, "C13": {"titulo": "El avatar: doble de riesgo", "escena": 12, "dur": "1:10", "plano": "Vos, en cámara.", "guion": "¿Se aprende igual con un avatar? Hay dos estudios chicos, y hay que leerlos como pilotos. En un ensayo cruzado, el aprendizaje fue igual con avatar que con presentador humano, pero la experiencia fue mejor con el humano. En un curso de inducción en otorrino, dos de cada tres no notaron diferencia en lo aprendido. Mi lectura: el avatar transmite información; el humano transmite confianza. Por eso el avatar es tu doble de riesgo: hace las escenas repetibles, y vos hacés las importantes. Y siempre, siempre, se avisa que es IA.", "yt": "", "mp4": "", "start": null, "end": null}, "C14": {"titulo": "Cómo grabé esta clase", "escena": 13, "dur": "1:20", "plano": "Vos, en cámara, mostrando la notebook o el celular en el trípode.", "guion": "Te cuento la cocina. Esta clase no tiene un set ni una productora: la grabé de una sola toma en Zoom, solo, compartiendo la pantalla con esta misma página y con la cámara en la esquina. Cámara a la altura de los ojos, luz de frente y una ventana nunca atrás. Al empezar cada escena dije su número en voz alta, y con la transcripción que arma Zoom se cortó el video en tramos, uno por escena. Lo subí a YouTube como no listado y la página muestra el tramo que toca. Una tarde de trabajo, sin editar nada.", "yt": "", "mp4": "", "start": null, "end": null}, "C15": {"titulo": "Detrás de escena de esta clase", "escena": 14, "dur": "1:10", "plano": "Vos, en cámara, o grabación de pantalla recorriendo los pasos.", "guion": "Esta clase la armamos con el mismo método de la 29. Primero el objetivo: que salgas sabiendo diseñar una charla donde el público hace algo. Después el guion maestro, escena por escena, con la evidencia verificada en PubMed. Recién entonces le pedí a Claude que convirtiera el guion en esta página: un solo archivo HTML, publicado gratis en GitHub Pages, que se abre en cualquier celular. Y por último grabé la toma en Zoom recorriendo la página. Contenido primero, envase después. Siempre.", "yt": "", "mp4": "", "start": null, "end": null}, "C16": {"titulo": "Cierre", "escena": 16, "dur": "0:50", "plano": "Vos, en cámara, plano un poco más cerrado.", "guion": "Llegaste al final, y no escuchaste una clase: la hiciste. Apostaste, ordenaste, decidiste sobre un paciente, moviste un gráfico y armaste tu propio prompt. Ahora te toca a vos: una diapositiva viva en tu próxima charla. Con una alcanza para no volver a dar una charla muerta. El público no vino a verte hablar: vino a pensar con vos. Nos vemos en la próxima charla. La de ustedes.", "yt": "", "mp4": "", "start": null, "end": null}}</script>

<script>
const CLIPS = JSON.parse(document.getElementById('clips').textContent);
/* Una sola toma en Zoom: pegá acá el código de YouTube; cada clip usa sus segundos start/end */

  if(c.yt) return `<div class="clip"><iframe src="https://www.youtube-nocookie.com/embed/${esc(c.yt)}?rel=0&modestbranding=1" title="${esc(c.titulo)}" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
  if(c.mp4) return `<div class="clip"><video src="${esc(c.mp4)}" controls playsinline preload="metadata"></video></div>`;
  if(!new URLSearchParams(location.search).has('guion')) return '';
  return `<div class="clip" role="img" aria-label="Video: ${esc(c.titulo)}"><div class="ph"><div class="play"></div></div><span class="tag">VIDEO ${id} · ${c.dur} · ${esc(c.titulo)}</span></div><details><summary>Guion de este video (lo que dice el Dr.)</summary><p class="muted" style="margin-top:8px">${esc(c.guion)}</p></details>`;
}
function theory(title, body, cite){ return `<div class="theory"><p class="eyebrow">Fundamento</p><h3>${title}</h3><p>${body}</p>${cite?`<p class="cite">${cite}</p>`:''}</div>`; }
function opts(id,list){ return `<div class="opts" id="${id}">`+list.map(([k,t])=>`<button class="opt" type="button" data-k="${k}"><span class="k">${k}</span><span>${t}</span></button>`).join('')+`</div>`; }
function bindOpts(id,cb,right){ const box=$(id), bs=[...box.querySelectorAll('.opt')];
  bs.forEach(b=>b.onclick=()=>{ if(box.dataset.l) return; box.dataset.l=1; bs.forEach(x=>{x.disabled=true; x.classList.toggle('picked',x===b); if(right&&x.dataset.k===right) x.classList.add('right');}); cb(b.dataset.k); }); }
function nextBtn(label='Seguir'){ return `<div class="row"><button class="btn" type="button" onclick="go(1)">${label} →</button></div>`; }
function go(d){ S.i=Math.max(0,Math.min(SC.length-1,S.i+d)); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function fillBars(){ requestAnimationFrame(()=>document.querySelectorAll('.bar .fill[data-w]').forEach(f=>f.style.width=f.dataset.w)); }
function bars(rows,max){ return `<div class="bars">`+rows.map(([l,v,col])=>`<div class="bar"><span>${l}</span><span class="n">${v}%</span><div class="track"><div class="fill" data-w="${100*v/max}%" style="background:${col||'var(--violet)'}"></div></div></div>`).join('')+`</div>`; }

/* Each scene: act, minutes, html(), after() */
const SC=[];
const add=(act,min,html,after)=>SC.push({act,min,html,after});

/* 1 · Bienvenida */
add(0,3,()=>`<section class="scene">

add(2,2,()=>`<section class="scene">

  <div id="r7"></div></section>`,
()=>{ const tl=$('tl'),b=$('tlb'),pad=16; const pos=m=>`calc(${pad}px + (100% - ${2*pad}px) * ${m/30})`;
  for(let m=0;m<=30;m+=5) tl.insertAdjacentHTML('beforeend',`<span class="tick" style="left:${pos(m)}">${m}'</span>`);
  const draw=()=>{tl.querySelectorAll('.mk,.gap').forEach(n=>n.remove()); const p=[0,...S.marks.slice().sort((a,b)=>a-b),30];
    for(let i=0;i<p.length-1;i++) if(p[i+1]-p[i]>10) tl.insertAdjacentHTML('beforeend',`<span class="gap" style="left:${pos(p[i])};width:calc((100% - ${2*pad}px) * ${(p[i+1]-p[i])/30})"></span>`);
    S.marks.forEach((m,i)=>tl.insertAdjacentHTML('beforeend',`<span class="mk" style="left:${pos(m)}">${i+1}</span>`)); b.disabled=S.marks.length<3;};
  tl.onclick=e=>{ if(S.marks.length>=3) return; const r=tl.getBoundingClientRect(); S.marks.push(Math.round(Math.max(0,Math.min(30,30*(e.clientX-r.left-pad)/(r.width-2*pad))))); draw(); };
  $('tlc').onclick=()=>{S.marks=[];draw();$('r7').innerHTML='';};
  b.onclick=()=>{ const p=[0,...S.marks.slice().sort((a,b)=>a-b),30]; let mx=0; for(let i=0;i<p.length-1;i++) mx=Math.max(mx,p[i+1]-p[i]);

  draw(); });

add(2,2,()=>`<section class="scene">

  <div id="r11"></div></section>`,
()=>{ const svg=$('ch'),r=$('rb'); const X=v=>50+(v-2)/38*560, Y=n=>220-Math.min(n,100)/100*190;
  let path=''; for(let v=2;v<=40;v+=.5) path+=(v===2?'M':'L')+X(v).toFixed(1)+' '+Y(1/(v/100*.25)).toFixed(1);
  const ticks=[2,10,20,30,40].map(v=>`<text x="${X(v)}" y="244" text-anchor="middle">${v}%</text>`).join('')+[0,50,100].map(n=>`<text x="40" y="${Y(n)+4}" text-anchor="end">${n}</text><line x1="50" x2="610" y1="${Y(n)}" y2="${Y(n)}" stroke="#4A3B57" stroke-dasharray="3 4"/>`).join('');
  let done=false; const upd=()=>{const v=+r.value,n=Math.round(1/(v/100*.25)); S.nnt=n; $('rbv').textContent=v+'%'; $('nntv').textContent=n;

  r.oninput=upd; upd(); });

/* 12 · Swipe avatar */
const CARDS=[['La bienvenida de un curso online','si'],['Comunicarle una mala noticia a un paciente','no'],['Las instrucciones de una tarea, repetidas cada cohorte','si'],['Un consentimiento informado','no'],['La misma pieza educativa traducida a otro idioma','si']];
add(3,3,()=>`<section class="scene">
  <p class="eyebrow">Escena 12 · ¿Avatar sí o no?</p>
  <h2>Decidí rápido: ¿esto lo puede decir tu avatar?</h2>
  <div class="card" id="card"></div>
  <div class="row"><button class="btn ghost" type="button" id="sno">No, me pongo yo</button><button class="btn" type="button" id="ssi">Sí, mi avatar</button></div>
  <div id="r12"></div></section>`,
()=>{ let i=0, ok=0; const show=()=>{ $('card').innerHTML=`<p class="eyebrow">${i+1} de ${CARDS.length}</p><p class="q">${CARDS[i][0]}</p>`; };
  const ans=a=>{ if(i>=CARDS.length) return; S.swipe[i]=a; if(CARDS[i][1]===a) ok++; i++; if(i<CARDS.length) show(); else { $('sno').disabled=$('ssi').disabled=true; S.swipeOk=ok;
    $('card').innerHTML=`<p class="q">${ok} de ${CARDS.length} bien</p><p>Regla: si el mensaje necesita que el otro te crea, ponete vos. Si es información que se repite, que la diga tu doble. Y siempre se avisa que es IA, con tu propia cara y tu propia voz, nunca la de un colega o un paciente.</p>`;
    $('r12').innerHTML=`${clip('C13')}${theory('Qué dice la evidencia del avatar','Dos pilotos chicos: en un ensayo cruzado con 13 estudiantes el aprendizaje fue igual con avatar que con presentador humano, pero la experiencia fue mejor con el humano; en un curso de inducción en otorrino, el 67% no notó diferencia en lo aprendido.','Reichert M, et al. JMIR Form Res. 2026;10:e90037 · Siddique H, Maweni R. Cureus. 2025;17(10):e94230.')}${nextBtn()}`; } };
  $('sno').onclick=()=>ans('no'); $('ssi').onclick=()=>ans('si'); show(); });

/* 13 · Grabar e integrar */
const SET=[['Cámara',[['A','A la altura de los ojos','ok'],['B','Desde abajo, apoyada en la mesa','no']]],['Luz',[['A','Ventana detrás tuyo','no'],['B','Luz de frente, pareja','ok']]],['Mirada',[['A','A la lente de la cámara','ok'],['B','A tu imagen en la pantalla','no']]]];
add(3,4,()=>`<section class="scene">
  <p class="eyebrow">Escena 13 · Grabalo bien y metelo en la clase</p>
  <h2>Armá tu set: elegí una opción en cada fila.</h2>
  ${SET.map(([t,o],j)=>`<div><p class="eyebrow" style="color:var(--muted)">${t}</p>${opts('s13_'+j,o.map(([k,l])=>[k,l]))}</div>`).join('')}
  <div id="r13"></div></section>`,
()=>{ let n=0; SET.forEach(([t,o],j)=>bindOpts('s13_'+j,k=>{ S.setup[j]=o.find(x=>x[0]===k)[2]; n++; if(n===3){ const ok=Object.values(S.setup).filter(x=>x==='ok').length;
  $('r13').innerHTML=`<div class="panel"><span class="verdict ${ok===3?'v-ok':'v-warn'}">${ok} de 3</span><p>Cámara a la altura de los ojos, luz de frente y mirada a la lente. Una sola toma en Zoom recorriendo la página, diciendo el número de cada escena: después se corta por tramos sin editar.</p></div>
  ${clip('C14')}
  <div class="panel"><h3>Probalo: pegá el link de un video de YouTube</h3><p class="muted">Así se integra la grabación: la subís a YouTube como «no listado», copiás el link y la página saca el código sola.</p>
  <label>Link de YouTube<input type="text" id="yt" placeholder="https://youtu.be/…"></label><div id="ytp"></div></div>${nextBtn('Pasar al Acto 4')}`;
  $('yt').oninput=e=>{ const m=e.target.value.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); S.yt=m?m[1]:null;
    $('ytp').innerHTML=m?`<p>Código del video: <b style="font-family:var(--f-data)">${m[1]}</b>. Este es el dato que va en la página. En la versión publicada, el video aparece acá mismo:</p><pre>"yt": "${m[1]}"</pre>`:''; }; }}, SET[j][1].find(x=>x[2]==='ok')[0])); });

/* 14 · Detrás de escena */
const BUILD=[['Objetivo','Qué tiene que saber hacer el alumno al salir'],['Guion maestro','Escena por escena, con la evidencia verificada en PubMed'],['Prompt a Claude','«Convertí este guion en una página interactiva de un solo archivo HTML»'],['Publicación','GitHub Pages: gratis, permanente, abre en cualquier celular'],['Grabación','Una toma en Zoom recorriendo la página, cortada por escena']];
add(4,3,()=>`<section class="scene">
  <p class="eyebrow">Escena 14 · Detrás de escena de esta clase</p>
  <h2>¿En qué orden armamos esta clase? Tocá los pasos en orden.</h2>
  <div class="steps" id="bs">${[3,0,4,1,2].map(i=>`<button class="chip" type="button" data-i="${i}"><span class="num">·</span><span><b>${BUILD[i][0]}</b> · <span class="muted">${BUILD[i][1]}</span></span></button>`).join('')}</div>
  <div class="row"><button class="btn ghost small" type="button" id="bsr">Empezar de nuevo</button></div>
  <div id="r14"></div></section>`,
()=>{ const cs=[...$('bs').querySelectorAll('.chip')]; const draw=()=>cs.forEach(c=>{const k=S.bsteps.indexOf(+c.dataset.i);c.classList.toggle('set',k>=0);c.querySelector('.num').textContent=k>=0?k+1:'·';});
  cs.forEach(c=>c.onclick=()=>{ if(S.bsteps.length===5||S.bsteps.includes(+c.dataset.i)) return; S.bsteps.push(+c.dataset.i); draw();
    if(S.bsteps.length===5){ const ok=S.bsteps.every((v,i)=>v===i);
    $('r14').innerHTML=`<div class="panel"><span class="verdict ${ok?'v-ok':'v-warn'}">${ok?'Ese es el orden':'El orden real: objetivo, guion, prompt, publicación, grabación'}</span><p>Contenido primero, envase después: el mismo método de la Clase 29. El video va al final, cuando ya sabés qué tiene que decir cada clip.</p>
    <details><summary>El prompt con el que se armó esta página</summary><pre>Convertí este guion maestro en una clase interactiva de un solo archivo HTML, para abrir en el celular. Una escena por pantalla, con barra de progreso. Cada escena tiene un tramo de video (una sola grabación en YouTube no listado, cortada por segundos) y una interacción: apuesta antes del dato, ordenar, clasificar, caso ramificado con feedback, gráfico con control deslizante. Al final, mostrale su recorrido. Paleta violeta y coral, letra grande, sin datos de pacientes reales.</pre></details></div>${clip('C15')}${nextBtn()}`; } });
  $('bsr').onclick=()=>{S.bsteps=[];draw();$('r14').innerHTML='';}; draw(); });

/* 15 · Constructor */
const FMT={A:['una pregunta de predicción','Con este tema y este dato, escribí una pregunta de predicción para hacerle al público antes de mostrar el dato: 4 opciones, un distractor con el error más común de los médicos y una explicación de dos líneas para después de votar.'],B:['un caso ramificado','Con este tema, armá un caso clínico ramificado en una página interactiva de un solo archivo HTML para el celular: dos decisiones con tres opciones cada una, una consecuencia y un feedback de dos líneas por opción, usando este dato en el feedback. Letra grande, sin datos de pacientes reales.'],C:['una diapositiva-app','Con este tema, armá una página interactiva de un solo archivo HTML con un control deslizante que muestre cómo cambia el resultado cuando cambia una variable, usando este dato como punto de partida. Fórmula y referencia al pie. Para proyectar y para abrir desde el celular.']};
add(4,3,()=>`<section class="scene">
  <p class="eyebrow">Escena 15 · Tu diapositiva viva</p>
  <h2>Armá el prompt de tu próxima charla.</h2>
  ${opts('o15',[['A','Una pregunta para apostar antes del dato'],['B','Un caso donde el público decide'],['C','Un gráfico que se mueve']])}
  <label>Tema de tu charla<input type="text" id="tema" placeholder="Por ejemplo: anticoagulación en fibrilación auricular"></label>
  <label>Un dato que quieras que no se olviden<input type="text" id="dato" placeholder="Por ejemplo: la mitad de los pacientes no recibe anticoagulación"></label>
  <div class="row"><button class="btn" type="button" id="mk">Armar mi prompt</button></div>
  <div id="r15"></div></section>`,
()=>{ let f=null; [...$('o15').querySelectorAll('.opt')].forEach(b=>b.onclick=()=>{f=b.dataset.k;[...$('o15').querySelectorAll('.opt')].forEach(x=>x.classList.toggle('picked',x===b));});
  $('mk').onclick=()=>{ S.tema=$('tema').value.trim(); S.dato=$('dato').value.trim(); if(!f){$('r15').innerHTML='<p class="muted">Elegí primero un formato.</p>';return;} S.format=f;
    const p=`Tema: ${S.tema||'[tu tema]'}\nDato: ${S.dato||'[tu dato]'}\n\n${FMT[f][1]}`;
    $('r15').innerHTML=`<div class="panel"><p class="eyebrow">Tu prompt, listo para pegar en Claude</p><pre id="pp">${esc(p)}</pre><div class="row"><button class="btn ghost small" type="button" id="cp">Copiar prompt</button></div>
    <p><b>Tarea 31:</b> armá ${FMT[f][0]}, probala en tu celular y mandá el link con tres líneas: qué hace el público, en qué minuto de la charla y qué aprende al hacerlo. Por diplomaturamaxia@gmail.com, jueves 5/11 antes de las 20 h, asunto «Tarea 31 – Apellido, Nombre».</p></div>${nextBtn('Ver mi recorrido')}`;
    $('cp').onclick=async e=>{try{await navigator.clipboard.writeText(p);e.target.textContent='Copiado';}catch{const r=document.createRange();r.selectNodeContents($('pp'));getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent='Seleccionado: copialo';}}; }; });

/* 16 · Recorrido */
add(4,2,()=>{ const G={A:'entender por qué la interacción enseña',B:'diseñar tu próxima charla con momentos interactivos',C:'usar video y avatar sin perder credibilidad',D:'armar con IA una diapositiva que se use'};
  const L1={A:'alta',B:'internación en sala',C:'terapia intensiva'},L2={A:'endoscopía en menos de 6 h',B:'endoscopía dentro de las 24 h',C:'endoscopía a las 48–72 h'};
  const n=[S.poll,S.goal,S.guess!==50||true,S.placebo,S.order.length===3,S.recall,S.marks.length===3,S.sortOk!=null,S.fix,S.d1,S.d2,S.nnt===20,S.swipeOk!=null,Object.keys(S.setup).length===3,S.bsteps.length===5,S.format].filter(Boolean).length;
  return `<section class="scene">
  <p class="eyebrow">Escena 16 · Tu recorrido</p>
  <h1>Hiciste ${n} cosas en esta clase. No escuchaste ninguna.</h1>
  <div class="path">
   <div><b>Objetivo</b><span>Querías ${G[S.goal]||'llevarte algo concreto'}.</span></div>
   <div><b>Escena 1</b><span>${{A:'Llegaste diciendo que en ninguna charla tu público hacía algo',B:'Llegaste con una o dos charlas donde tu público hizo algo',C:'Llegaste con tres o más charlas participativas',D:'Llegaste sin dar charlas todavía'}[S.poll]||'—'}.</span></div>
   <div><b>Escenas 3 y 6</b><span>Apostaste ${S.guess}% y después ${S.recall==='B'?'recordaste el 26%':'no recuperaste el 26%'}.</span></div>
   <div><b>Escena 7</b><span>Interacciones en los minutos ${S.marks.slice().sort((a,b)=>a-b).join(', ')||'—'}.</span></div>
   <div><b>Escena 8</b><span>Clasificaste bien ${S.sortOk??'—'} de 6 formatos.</span></div>
   <div><b>Escena 10</b><span>${L1[S.d1]||'—'}, después ${L2[S.d2]||'—'}. Score: ${S.gbs??'—'}.</span></div>
   <div><b>Escena 12</b><span>Acertaste ${S.swipeOk??'—'} de 5 usos del avatar.</span></div>
   <div><b>Escena 15</b><span>Tu prompt: ${S.format?FMT[S.format][0]:'—'}${S.tema?' sobre '+esc(S.tema):''}.</span></div>
  </div>
  <div class="theory"><p class="eyebrow">Para llevarse</p>
   <p><b>1.</b> Lo que enseña es la pregunta, no el aparato.</p>
   <p><b>2.</b> En vivo o grabada, cada 8 a 10 minutos el público tiene que hacer algo.</p>
   <p><b>3.</b> La IA arma el envase; la medicina y la honestidad las ponés vos.</p></div>
  ${clip('C16')}
  <details><summary>Referencias</summary><p class="cite">Freeman S, et al. Proc Natl Acad Sci U S A. 2014;111(23):8410-5 · Grzeskowiak LE, et al. J Contin Educ Health Prof. 2015;35(4):261-9 · Larsen DP, et al. Med Educ. 2013;47(7):674-82 · Cook DA, et al. Acad Med. 2010;85(10):1589-602 · Reichert M, et al. JMIR Form Res. 2026;10:e90037 · Siddique H, Maweni R. Cureus. 2025;17(10):e94230 · Jain A, Merchant Y. Oral Maxillofac Surg. 2026;30(1) · Blatchford O, et al. Lancet. 2000;356:1318-21 · Laine L, et al. Am J Gastroenterol. 2021;116(5):899-917 · Gralnek IM, et al. Endoscopy. 2021;53(3):300-32 · Lau JYW, et al. N Engl J Med. 2020;382(14):1299-308.</p></details>
  <div class="row"><button class="btn ghost" type="button" onclick="location.reload()">Volver a jugar</button></div></section>`; });

function render(){
  const s=SC[S.i]; let html='';
  SC.forEach((x,j)=>{ if(j>0&&SC[j-1].act!==x.act) html+='<i class="gap"></i>'; html+=`<i class="${j<S.i?'done':j===S.i?'on':''}"></i>`; });
  $('dots').innerHTML=html;
  const elapsed=SC.slice(0,S.i).reduce((a,x)=>a+x.min,0), total=SC.reduce((a,x)=>a+x.min,0);
  $('where').textContent=`${ACTS[s.act]} · ${S.i+1}/${SC.length} · min ${elapsed}–${elapsed+s.min} de ${total}`;
  stage.innerHTML=s.html(); if(s.after) s.after();
}
render();
</script>
